name: Fix production backend file

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove accidental Markdown fences from backend/main.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/main.py")
          text = path.read_text(encoding="utf-8")

          lines = text.splitlines(keepends=True)

          if lines and lines[0].strip() == "```python":
              lines.pop(0)

          while lines and not lines[-1].strip():
              lines.pop()

          if lines and lines[-1].strip() == "```":
              lines.pop()

          path.write_text("".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Remove temporary repair workflow
        run: rm -f .github/workflows/fix-production-main.yml

      - name: Commit corrected backend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py .github/workflows/fix-production-main.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: remove markdown fences from production backend"
          git push
